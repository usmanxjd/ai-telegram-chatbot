[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-telegram-support-bot"
version = "0.1.0"
description = "End-to-end AI customer support Telegram chatbot using LangChain and Hugging Face"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Assistant" }]
dependencies = [
  "python-telegram-bot>=21.0,<22.0",
  "langchain>=0.2.10",
  "langchain-community>=0.2.10",
  "langchain-huggingface>=0.0.3",
  "langchain-text-splitters>=0.2.2",
  "faiss-cpu>=1.8.0.post1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.4",
  "sentence-transformers>=3.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
support-bot = "support_bot.bot:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
